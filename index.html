<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yoga Nidra — a self-directed journey</title>
  <meta name="description" content="A drip-released audio journey that teaches you to perform Yoga Nidra on yourself, from memory — grounded in the ancient texts." />
  <meta name="theme-color" content="#14100c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="hero">
    <div class="enso" aria-hidden="true"></div>
    <h1>Yoga Nidra</h1>
    <p class="tagline">A self-directed journey from the ancient texts</p>
    <p class="goal">Learn to perform the practice on yourself — from memory, unaided.</p>
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"><span id="progressFill"></span></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
  </header>

  <main id="journey" class="journey" aria-live="polite">
    <p class="loading" id="loading">Loading the journey…</p>
  </main>

  <footer class="foot">
    <p>Grounded in the Upaniṣads, the Yoga Sūtras, and the tantric texts.</p>
    <p class="muted">Audio: Kokoro TTS (Apache-2.0). Not a substitute for sleep or medical care.</p>
  </footer>

  <!-- single shared player -->
  <audio id="player" preload="none"></audio>

  <script src="app.js" defer></script>
</body>
</html>
